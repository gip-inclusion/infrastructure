name: Terraform

on:
  # Run plans for any PR base branch (not only main)
  # No "paths:" filter: the required "Terraform plans" check must be reported for all PR, even when there's no changes
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

  # Apply only when code lands on main
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'

  # Manual run (optionally target a single module)
  workflow_dispatch:
    inputs:
      module_path:
        description: "Module path (terraform directory)"
        default: ""
      base:
        description: "Base to compare against (branch or commit SHA)"
        default: "main"

permissions:
  contents: read
  actions: read

jobs:
  detect-modules:
    name: Auto-detect changed modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need history to diff against the base SHA
          fetch-depth: 0

      - id: build
        name: Build matrix
        env:
          # Inputs for workflow_dispatch
          INPUT_BASE: ${{ github.event.inputs.base }}
          INPUT_MODULE_PATH: ${{ github.event.inputs.module_path }}
          # Context required for diff computation
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python .github/scripts/build_matrix.py

  run-terraform:
    name: Run Terraform
    needs: detect-modules

    if: ${{ needs.detect-modules.outputs.count != '0' }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-modules.outputs.matrix) }}

    # Call the reusable workflow once per module entry in the matrix
    uses: ./.github/workflows/_terraform-module.yml
    with:
      module_path: ${{ matrix.module_path }}
      module_label: ${{ matrix.module_label }}
      commit_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      # Apply only on push to main; otherwise do a plan
      # Checking for ref_name is redundant but deliberate here (push events only applies to main)
      apply: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    secrets:
      SCW_TF_CI_ACCESS_KEY: ${{ secrets.SCW_TF_CI_ACCESS_KEY }}
      SCW_TF_CI_SECRET_KEY: ${{ secrets.SCW_TF_CI_SECRET_KEY }}
      SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
      AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      TF_PLAN_SIGNING_KEY: ${{ secrets.TF_PLAN_SIGNING_KEY }}

  # Global check which is configured required on main
  # Since per-module job names change with the matrix, this "stable" check stays pending while a plan awaits approval,
  # and only succeeds once every plan of the PR is successful
  plans:
    name: Terraform plans
    needs: [detect-modules, run-terraform]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check that every plan succeeded
        env:
          DETECT_RESULT: ${{ needs.detect-modules.result }}
          MODULE_COUNT: ${{ needs.detect-modules.outputs.count }}
          PLANS_RESULT: ${{ needs.run-terraform.result }}
        run: |
          set -euo pipefail
          test "$DETECT_RESULT" = success || { echo "::error::Module detection ended with $DETECT_RESULT"; exit 1; }
          if [ "$MODULE_COUNT" = 0 ]; then
            echo "No Terraform module changed"
            exit 0
          fi
          test "$PLANS_RESULT" = success || { echo "::error::Terraform plans ended with $PLANS_RESULT"; exit 1; }
          echo "All $MODULE_COUNT Terraform plans succeeded"
