name: dependabot-autofix

on: pull_request

permissions:
  contents: write

jobs:
  autofix:
    # https://docs.github.com/en/code-security/dependabot/troubleshooting-dependabot/troubleshooting-dependabot-on-github-actions
    if: github.triggering_actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR branch instead of the detached merge commit, so the docs commit can be pushed
          ref: ${{ github.head_ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Install terraform-docs
        uses: ./.github/actions/install-terraform-docs

      - name: Generate Terraform docs
        shell: bash
        run: |
          set -euo pipefail

          for dir in $(find infrastructure -name '*.tf' -exec dirname {} + | sort -u); do
            terraform-docs markdown table --output-file README.md --output-mode inject "$dir"
          done
          git add -- '*README.md'

          if git diff --cached --quiet; then
            echo "Terraform docs are up to date"
            exit 0
          fi

          git -c user.name="terraform-docs[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: update terraform docs"

          git push
