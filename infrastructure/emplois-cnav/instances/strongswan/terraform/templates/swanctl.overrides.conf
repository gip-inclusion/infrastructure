# Overrides for the swanctl section, included after the packaged swanctl.conf (glob order).
# swanctl requires no plugins for this PSK-only setup.
# Without this, swanctl falls back to upstream's plugin list and warns about every plugin Debian does not build.
# load_modular builds the list solely from declared plugins (nothing declared => nothing loaded).
# Just `load =` won't do the job: an empty assignment resets the key to its default (the full list).

swanctl {
    load_modular = yes
}
