# Run unattended-upgrades between 03:00 and 04:00 UTC (default timer: 06:00, during working hours in France),
# so that its reboot at 05:00 UTC (see 51unattended-upgrades-reboot) happens before the working day

[Timer]
# An empty value resets the default OnCalendar, otherwise it still applies
OnCalendar=
OnCalendar=*-*-* 3:00
